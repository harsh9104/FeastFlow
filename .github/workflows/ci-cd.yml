# FeastFlow CI/CD
#   every push / PR : backend lint + tests, frontend typecheck + build, Docker image build
#   push to main    : the above, then build + push the image to ECR and roll it out to the ASG
#   Actions tab     : "Run workflow" on main redeploys on demand
# AWS Learner Lab allows no IAM users or OIDC roles, so the deploy job uses the lab session keys,
# stored as repo secrets. Refresh them after every Start Lab: infra/scripts/gh-set-aws-secrets.sh
name: CI/CD
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build   # tsc --noEmit + vite build

  docker:
    # Check that the image builds. On main the deploy job builds (and pushes) it instead.
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t feastflow:ci .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    environment: production
    concurrency: {group: deploy-production, cancel-in-progress: false}   # never two rollouts at once
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || ! aws sts get-caller-identity >/dev/null 2>&1; then
            echo "::error::AWS credentials missing or expired. Start the lab, then run infra/scripts/gh-set-aws-secrets.sh and re-run this job."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Build and push image to ECR
        run: VERSION="${GITHUB_SHA::7}" bash infra/scripts/02b-push-image.sh

      - name: Rolling redeploy of the Auto Scaling Group
        run: bash infra/scripts/redeploy.sh

      - name: Smoke test through the load balancer
        run: |
          IN_SERVICE=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names feastflow-asg \
            --query 'length(AutoScalingGroups[0].Instances[?LifecycleState==`InService`])' --output text)
          ALB=$(aws elbv2 describe-load-balancers --names feastflow-alb --query 'LoadBalancers[0].DNSName' --output text)
          {
            echo "### Deployment"
            echo "- Image: \`feastflow:${GITHUB_SHA::7}\` (also \`:latest\`)"
            echo "- Site: http://$ALB"
            echo "- In-service instances: $IN_SERVICE"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$IN_SERVICE" = "0" ]; then
            echo "- Stack is parked: image pushed, it goes live on the next start.sh" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 12); do
            if BODY=$(curl -fsS --max-time 10 "http://$ALB/api/health/ready"); then
              echo "health: $BODY"
              echo "- Health check: OK \`$BODY\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i failed, retrying in 10 s"; sleep 10
          done
          echo "- Health check: FAILED" >> "$GITHUB_STEP_SUMMARY"
          exit 1
