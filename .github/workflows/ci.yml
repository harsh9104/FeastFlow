name: CI

# Lint, test and build on every pull request and every push. Nothing here deploys (see cd.yml).
on:
  pull_request:
  push:
    branches-ignore: [gh-pages]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feastflow
          POSTGRES_PASSWORD: feastflow
          POSTGRES_DB: feastflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feastflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://feastflow:feastflow@localhost:5432/feastflow_test
      TEST_DATABASE_URL: postgresql+psycopg://feastflow:feastflow@localhost:5432/feastflow_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # The tests build their schema from the models, so run the real migrations separately:
      # this catches a migration that is missing, broken or not reversible.
      - name: Migrations apply and roll back
        env:
          ADMIN_EMAIL: ci-admin@feastflow.app
          ADMIN_PASSWORD: ci-password-123
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: npm run build

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: feastflow:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_USER=feastflow \
            -e POSTGRES_PASSWORD=feastflow -e POSTGRES_DB=feastflow postgres:16
          for i in $(seq 1 30); do
            docker exec db pg_isready -U feastflow && break || sleep 2
          done
          docker run -d --name app --network ci -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://feastflow:feastflow@db:5432/feastflow \
            -e JWT_SECRET=ci-secret -e APP_VERSION=${{ github.sha }} feastflow:ci
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/api/health && break || sleep 2
          done
          curl -sf http://localhost:8000/api/health | grep -q '"status":"ok"'
          curl -sf http://localhost:8000/api/health/ready | grep -q '"db":"ok"'
          curl -sf http://localhost:8000/ | grep -qi '<div id="root">'
          docker logs app 2>&1 | tail -n 20
