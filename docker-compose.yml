services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: feastflow
      POSTGRES_PASSWORD: feastflow
      POSTGRES_DB: feastflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feastflow"]
      interval: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://feastflow:feastflow@db:5432/feastflow
      LOCUST_URL: http://locust:8089
    volumes: [reports:/srv/reports]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  locust:
    build: ./loadtest
    command: ["--host", "http://app:8000"]
    ports: ["8089:8089"]
    depends_on: [app]
volumes:
  pgdata:
  reports:
