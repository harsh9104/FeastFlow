services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: feastflow
      MYSQL_USER: feastflow
      MYSQL_PASSWORD: feastflow
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,sns,s3
    ports: ["4566:4566"]
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro

  api:
    build: ./backend
    env_file: .env.example
    ports: ["8000:8000"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      mysql: {condition: service_healthy}
      localstack: {condition: service_started}

  worker:
    build: ./backend
    command: ["python", "-m", "worker.main"]
    env_file: .env.example
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      mysql: {condition: service_healthy}
      localstack: {condition: service_started}

volumes:
  mysql-data:
