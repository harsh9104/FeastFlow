services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: feastflow
      MYSQL_USER: feastflow
      MYSQL_PASSWORD: feastflow
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,sns,s3
    ports: ["4566:4566"]
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      # Healthy only once init-aws.sh has created the queues, topic and bucket.
      test: ["CMD", "awslocal", "s3api", "head-bucket", "--bucket", "feastflow-assets"]
      interval: 5s
      retries: 30

  api:
    build: .
    env_file: .env.example
    ports: ["8000:8000"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      mysql: {condition: service_healthy}
      localstack: {condition: service_healthy}

  worker:
    build: .
    command: ["python", "-m", "worker.main"]
    env_file: .env.example
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      mysql: {condition: service_healthy}
      localstack: {condition: service_healthy}

  # Only with: docker compose --profile loadtest up   (UI at http://localhost:8089)
  locust:
    build: ./loadtest
    profiles: [loadtest]
    command: ["-f", "/home/locust/locustfile.py", "--host", "http://api:8000"]
    env_file: .env.example
    ports: ["8089:8089"]
    depends_on: [api]

volumes:
  mysql-data:
